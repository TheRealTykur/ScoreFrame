# ESPN league paths: sport/league
leagues:
  - basketball/nba
  - football/nfl
  - hockey/nhl
  - baseball/mlb

# Optional: only show games involving these team abbreviations (e.g. PHI, NYY).
# Leave empty to show every game.
favorite_teams: []

poll_live_seconds: 15     # poll rate while any game is live
poll_idle_seconds: 120    # poll rate otherwise
page_seconds: 10          # how long each page shows when games overflow the screen
fullscreen: true          # false = 1280x720 resizable window for development
